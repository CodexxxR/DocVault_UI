version: "3.8"

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/docvault-realm.json:/opt/keycloak/data/import/DocVault-realm.json
      - keycloak-data:/opt/keycloak/data

volumes:
  keycloak-data:
